<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Button Click Popup</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #000000;
        }
        button {
            padding: 80px 15px;
            font-size: 18px;
            cursor: pointer;
            background-color: #572f28;
            color: white;
            border: none;
            border-radius: 5px;
            transition: background-color 0.3s;
			width: 80px
			
        }
		button img {
            max-width: 100%; /* Ensure image fits within button width */
            max-height: 100%; /* Ensure image fits within button height */
            object-fit: cover; /* Maintain aspect ratio without stretching */
        }
        button:hover {
            background-color: #8f4538;
        }
        #popup {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: #000;
            color: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.3);
            text-align: center;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <button id="clickButton"><img src="knocker.png" alt="Button Image"></button>
    <div id="popup"></div>
	<audio id="popupSound" src="echo-dungeon.mp3"></audio>

    <script>
        let clickCount = 0;
        const minClicks = 1;
        const maxClicks = 25;
        let requiredClicks = Math.floor(Math.random() * (maxClicks - minClicks + 1)) + minClicks;
        const button = document.getElementById('clickButton');
        const popup = document.getElementById('popup');

        popup.textContent = `Congratulations! You've clicked the button ${requiredClicks} times!`;

        button.addEventListener('click', () => {
            clickCount++;
            if (clickCount === requiredClicks) {
                popup.style.display = 'block';
                setTimeout(() => {
                    popup.style.display = 'none';
                    clickCount = 0; // Reset counter after popup
                    requiredClicks = Math.floor(Math.random() * (maxClicks - minClicks + 1)) + minClicks;
                    popup.textContent = `Congratulations! You've clicked the button ${requiredClicks} times!`;
                }, 3000); // Popup disappears after 3 seconds
            }
        });
    </script>
</body>
</html>
